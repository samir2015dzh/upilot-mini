services:
  upilot-mini:
    build: .
    image: samir2013dzh/upilot-mini:latest
    container_name: upilot-mini
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 也可以把 cookie 写进 ./config/config.yaml 的 p115.cookie
      - P115_COOKIE=${P115_COOKIE:-}
    volumes:
      # 可选：想跟着 symedia 自动同步 115 cookie 就把它的配置目录只读挂进来，
      # 再把 p115.cookie_from 设成 /symedia-config/config.yaml（面板「115 账号」里也能填）
      # - /home/<user>/symedia/config:/symedia-config:ro
      # 配置文件 + SQLite 状态（可读可写）
      - ./config:/config
      # 要监控的媒体目录（挂载点固定为 /media/source）
      # 开了「传完就删掉本地源文件」就必须可写（rw），并且给容器用户 uid 1000 单独授权：
      #   setfacl -R -m u:1000:rwx /path/to/your/media
      #   setfacl -R -d -m u:1000:rwx /path/to/your/media   # 新文件也继承
      # 只读监控（不开删除）时用 :ro 更稳妥
      - /path/to/your/media:/media/source:rw
    ports:
      # 只在本机开放状态页；不需要可以删掉
      - "127.0.0.1:9844:9844"
    # 日志轮转：Docker 默认的 json-file 不限大小，纯秒传模式下长期等待的文件多了，
    # 日志会一直涨。最多留 3 个 10 MB 的文件（docker logs 仍可看最近 30 MB）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
