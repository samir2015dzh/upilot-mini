services:
  upilot-mini:
    build: .
    image: samir2013dzh/upilot-mini:latest
    container_name: upilot-mini
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 也可以把 cookie 写进 ./config/config.yaml 的 p115.cookie
      - P115_COOKIE=${P115_COOKIE:-}
    volumes:
      # 配置文件 + SQLite 状态（可读可写）
      - ./config:/config
      # 要监控的媒体目录（挂载点固定为 /media/source，只读即可）
      - /path/to/your/media:/media/source:ro
    ports:
      # 只在本机开放状态页；不需要可以删掉
      - "127.0.0.1:9844:9844"
