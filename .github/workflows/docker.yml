name: Build and push upilot-mini

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "constraints.txt"
      - "ruff.toml"
      - "app/**"
      - "tests/**"
      - "config/config.example.yaml"
      - ".github/workflows/docker.yml"
  # PR 只跑测试，不构建、不推镜像
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: upilot-mini

jobs:
  # 先测后推：测试或 lint 不过，build 根本不会跑，:latest 不会被坏提交覆盖
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install ruff==0.17.4
      - name: Lint (ruff F/B)
        run: ruff check app
      - name: 依赖能正常导入（锁定版本自检）
        run: |
          cd app
          python -c "from p115client import P115Client; from p115client.tool import P115MultipartUpload; from p115oss import oss_multipart_upload_init, oss_multipart_upload_part_iter, upload_file_init; from p115oss.oss import oss_url; print('ok')"
      - name: Offline tests
        run: python tests/test_flow.py

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # 通过 env 中转，才能在 if 里做非空判断（secrets 上下文不能直接用于 if）
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Show build target
        run: |
          echo "docker hub : ${DH_USER:-<未配置，将只推 GHCR>}/${IMAGE_NAME}"
          echo "ghcr target: ghcr.io/${{ github.repository }}"

      - name: Short SHA
        id: meta
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.run_number }}
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub
        if: env.DH_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ env.DH_USER }}/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ env.DH_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            docker.io/${{ env.DH_USER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- GHCR：\`ghcr.io/${{ github.repository }}:${{ github.run_number }}\` / \`:${{ steps.meta.outputs.sha }}\`"
            if [ -n "${DH_TOKEN}" ]; then
              echo "- Docker Hub：\`${DH_USER}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}\` / \`:${{ steps.meta.outputs.sha }}\`"
            else
              echo "- Docker Hub：跳过（未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
