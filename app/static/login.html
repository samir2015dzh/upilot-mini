<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>登录 · UPilot-mini</title>
<style>
  /* 与仪表盘同一套设计语言：同样的色板变量、卡片、圆角、渐变主按钮、pill */
  :root{
    color-scheme:dark;
    --bg:#0d1017; --panel:#151922; --line:#242a37; --line-2:#2f3747; --line-3:#3b445a;
    --fg:#e9edf5; --muted:#aab3c5; --dim:#8892a6; --field:#10141c; --field-focus:#121722;
    --indigo:#6366f1; --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185;
    --err-fg:#fda4af; --radius:12px;
    font-synthesis:none;
  }
  @media (prefers-color-scheme:light){
    :root{color-scheme:light;
      --bg:#f3f5f9; --panel:#fff; --line:#e3e7ef; --line-2:#d3d9e5; --line-3:#bcc5d6;
      --fg:#1a2030; --muted:#5a6479; --dim:#7a8499; --field:#f6f8fb; --field-focus:#fff;
      --indigo:#4f46e5; --emerald:#10b981; --amber:#f59e0b; --rose:#e11d48; --err-fg:#be123c}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  body{min-height:100vh;display:grid;place-items:center;padding:28px}

  form{position:relative;z-index:1;width:100%;max-width:392px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px}

  .brand{display:flex;align-items:center;gap:13px;margin-bottom:20px}
  .logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
    background:var(--indigo)}
  .logo svg{width:24px;height:24px}
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line-2);background:var(--panel);font-size:11.5px;font-weight:500;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);flex:none}
  .dot.amber{background:var(--amber)}

  label{display:block;color:var(--muted);font-size:12.5px;margin:0 0 7px}
  .field{margin-bottom:15px}
  input[type=text],input[type=password]{width:100%;font:inherit;color:var(--fg);
    background:var(--field);border:1px solid var(--line-2);border-radius:9px;
    padding:11px 12px;transition:.16s ease;outline:none}
  input::placeholder{color:var(--dim)}
  input[type=text]:hover,input[type=password]:hover{border-color:var(--line-3)}
  input[type=text]:focus,input[type=password]:focus{border-color:rgba(99,102,241,.85);
    box-shadow:0 0 0 3px rgba(99,102,241,.2);background:var(--field-focus)}

  button{width:100%;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 14px;border:1px solid transparent;border-radius:9px;
    background:var(--indigo);color:#fff}
  button:hover{filter:brightness(1.08)}
  button svg{width:16px;height:16px}

  .err{display:flex;align-items:center;gap:8px;margin-bottom:15px;padding:9px 11px;border-radius:10px;
    font-size:12.5px;color:var(--err-fg);background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.3)}
  .err svg{width:15px;height:15px;flex:none}

  .site{margin-top:12px;text-align:center;color:var(--dim);font-size:11.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  @media (max-width:420px){form{padding:18px}}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V6"/><path d="M6 12l6-6 6 6"/><path d="M4 21h16"/>
      </svg>
    </div>
    <div>
      <h1>UPilot-mini <span class="pill"><span class="dot amber"></span>未登录</span></h1>
      <div class="sub">监控本地目录 · SHA1 秒传优先 · 重试不重传</div>
    </div>
  </div>

  {{ERROR}}

  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" value="{{USER}}" autocomplete="username"
           autofocus required spellcheck="false" />
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
  </div>
  <input type="hidden" name="next" value="{{NEXT}}" />
  <button type="submit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
    </svg>
    登录
  </button>


  {{SITE_BLOCK}}
</form>
</body>
</html>
