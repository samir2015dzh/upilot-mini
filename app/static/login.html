<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>登录 · UPilot-mini</title>
<style>
  /* 极简浅色风（对齐参考稿）：白底、320px 居中单列、直角输入框与按钮、单一主色 #2196F3 */
  :root{
    --bg:#ffffff; --fg:#333333; --muted:#757575; --border:#e5e5e5;
    --blue:#2196f3; --blue-dark:#1976d2; --danger-bg:#fdecea; --danger-bd:#f5c6c0; --danger-fg:#c62828;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    display:flex;align-items:center;justify-content:center;padding:32px 24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  .box{width:100%;max-width:320px}

  /* logo：64px 描边圆 + 主色图标 */
  .logo{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
    border:2px solid var(--blue);display:grid;place-items:center}
  .logo svg{width:28px;height:28px;stroke:var(--blue)}

  /* 两行主标题 */
  h1{margin:0 0 33px;font-size:40px;font-weight:600;line-height:46px;text-align:center;
    letter-spacing:-.2px;color:var(--fg)}
  h1 span{display:block}

  input[type=text],input[type=password]{display:block;width:100%;height:36px;padding:0 14px;
    font:inherit;color:var(--fg);background:#fff;border:1px solid var(--border);border-radius:0;
    outline:none;transition:border-color .15s ease}
  form > input[type=text],form > input[type=password]{margin-top:9px}
  form > input[type=text]:first-of-type{margin-top:0}
  input::placeholder{color:var(--muted)}
  input[type=text]:focus,input[type=password]:focus{border-color:var(--blue)}

  button{display:block;width:100%;height:37px;margin-top:10px;font:inherit;font-size:15px;
    color:#fff;background:var(--blue);border:0;border-radius:0;cursor:pointer;
    transition:background .15s ease}
  button:hover{background:var(--blue-dark)}
  button:focus-visible{outline:2px solid var(--blue-dark);outline-offset:2px}

  .err{display:flex;align-items:center;gap:7px;margin:9px 0 10px;padding:8px 10px;
    font-size:13px;color:var(--danger-fg);background:var(--danger-bg);border:1px solid var(--danger-bd)}
  .err svg{width:14px;height:14px;flex:none;stroke:currentColor;position:relative;top:.5px}
  .err + input[type=text]{margin-top:0}

  .site{margin-top:16px;text-align:center;color:#d0d0d0;font-size:11.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  @media (max-width:380px){h1{font-size:30px;line-height:40px}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>
    </svg>
  </div>

  <h1><span>UPilot-mini</span><span>秒传优先上传</span></h1>

  <form method="post" action="/login" autocomplete="on">
    {{ERROR}}

    <input name="username" type="text" value="{{USER}}" placeholder="用户名"
           autocomplete="username" autofocus required spellcheck="false" />
    <input name="password" type="password" placeholder="密码"
           autocomplete="current-password" required />
    <input type="hidden" name="next" value="{{NEXT}}" />
    <button type="submit">登录</button>
  </form>

  {{SITE_BLOCK}}
</div>
</body>
</html>
