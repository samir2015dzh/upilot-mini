<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>登录 · UPilot-mini</title>
<style>
  /* 与仪表盘同一套设计语言：同样的色板变量、卡片、圆角、渐变主按钮、pill、hint */
  :root{
    --bg:#08090d; --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.15);
    --fg:#eef1f7; --muted:#b3bac9; --dim:#98a1b2;
    --indigo:#6366f1; --violet:#8b5cf6; --emerald:#34d399; --sky:#38bdf8;
    --amber:#fbbf24; --rose:#fb7185; --slate:#94a3b8;
    --radius:16px;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  body{min-height:100vh;display:grid;place-items:center;padding:28px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(46% 40% at 12% -6%, rgba(99,102,241,.20), transparent 70%),
      radial-gradient(40% 36% at 88% -10%, rgba(52,211,153,.16), transparent 70%),
      radial-gradient(50% 40% at 60% 108%, rgba(139,92,246,.12), transparent 70%)}

  form{position:relative;z-index:1;width:100%;max-width:392px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 26px 60px -48px #000}

  .brand{display:flex;align-items:center;gap:13px;margin-bottom:20px}
  .logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
    background:linear-gradient(140deg,#6366f1,#22d3ee 55%,#34d399);
    box-shadow:0 10px 30px -10px rgba(99,102,241,.75), inset 0 1px 0 rgba(255,255,255,.35)}
  .logo svg{width:24px;height:24px}
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .sub{color:#bcc3d0;font-size:12.5px;margin-top:3px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line-2);background:var(--panel);font-size:11.5px;font-weight:500;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);flex:none}
  .dot.amber{background:var(--amber)}

  label{display:block;color:var(--muted);font-size:12.5px;margin:0 0 7px}
  .field{margin-bottom:15px}
  input[type=text],input[type=password]{width:100%;font:inherit;color:var(--fg);
    background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:11px;
    padding:11px 12px;transition:.16s ease;outline:none}
  input::placeholder{color:rgba(255,255,255,.26)}
  input[type=text]:hover,input[type=password]:hover{border-color:rgba(255,255,255,.24)}
  input[type=text]:focus,input[type=password]:focus{border-color:rgba(99,102,241,.85);
    box-shadow:0 0 0 3px rgba(99,102,241,.18);background:rgba(255,255,255,.06)}

  button{width:100%;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 14px;border:1px solid transparent;border-radius:11px;transition:.16s ease;
    background:linear-gradient(135deg,rgba(99,102,241,.95),rgba(56,189,248,.9));
    box-shadow:0 10px 24px -12px rgba(99,102,241,.9)}
  button:hover{transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(99,102,241,1)}
  button:active{transform:translateY(0)}
  button svg{width:16px;height:16px}

  .err{display:flex;align-items:center;gap:8px;margin-bottom:15px;padding:9px 11px;border-radius:10px;
    font-size:12.5px;color:#fecdd3;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.3)}
  .err svg{width:15px;height:15px;flex:none}

  .hint{display:flex;gap:8px;align-items:flex-start;margin-top:15px;padding:8px 10px;
    font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:10px;line-height:1.5}
  .hint svg{width:14px;height:14px;flex:none;opacity:.85;margin-top:2px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
    background:rgba(255,255,255,.10);border:1px solid var(--line-2);border-radius:6px;
    padding:1px 5px;color:#a5b4fc}
  .site{margin-top:12px;text-align:center;color:var(--dim);font-size:11.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  @media (max-width:420px){form{padding:18px}}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V6"/><path d="M6 12l6-6 6 6"/><path d="M4 21h16"/>
      </svg>
    </div>
    <div>
      <h1>UPilot-mini <span class="pill"><span class="dot amber"></span>未登录</span></h1>
      <div class="sub">监控本地目录 · SHA1 秒传优先 · 重试不重传</div>
    </div>
  </div>

  {{ERROR}}

  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" value="{{USER}}" autocomplete="username"
           autofocus required spellcheck="false" />
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
  </div>
  <input type="hidden" name="next" value="{{NEXT}}" />
  <button type="submit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
    </svg>
    登录
  </button>

  <div class="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>
    </svg>
    <span>登录状态在本机浏览器保持数天 · 连续输错会被短暂锁定 · 也可用 <code>?token=</code> 给脚本走</span>
  </div>

  {{SITE_BLOCK}}
</form>
</body>
</html>
